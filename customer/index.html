<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tạo link mời khách — Thiệp cưới</title>
  <link rel="stylesheet" href="../assets/css/customer.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20y=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
</head>
<body class="customer-page">
  <div class="customer-wrap">
    <a class="customer-back" href="../index.html">← Về thiệp cưới</a>

    <div class="customer-card">
      <h1 class="customer-title">Tạo link khách mời</h1>

      <form id="customer-form" class="customer-form">
        <div class="customer-form-row">
          <div class="customer-field customer-field--name">
            <label class="customer-label" for="customer-guest-name">Họ và tên</label>
            <input
              id="customer-guest-name"
              class="customer-input"
              type="text"
              name="guest"
              placeholder="Nguyễn Văn An"
              autocomplete="name"
              required
            />
          </div>

          <div class="customer-field customer-field--nick">
            <label class="customer-label" for="customer-nickname">Biệt danh</label>
            <input
              id="customer-nickname"
              class="customer-input"
              type="text"
              name="nickname"
              placeholder="Hương, Long…"
              autocomplete="off"
            />
          </div>

          <div class="customer-field customer-field--role">
            <label class="customer-label" for="customer-role">Xưng hô</label>
            <select id="customer-role" class="customer-select" name="role" required>
              <option value="" disabled selected>Chọn</option>
              <option value="Anh">Anh</option>
              <option value="Chị">Chị</option>
              <option value="Em">Em</option>
              <option value="Bạn">Bạn</option>
              <option value="Cô">Cô</option>
              <option value="Chú">Chú</option>
              <option value="Bác">Bác</option>
              <option value="Ông">Ông</option>
              <option value="Bà">Bà</option>
              <option value="Cậu">Cậu</option>
              <option value="Dì">Dì</option>
              <option value="Thầy">Thầy</option>
              <option value="Cô giáo">Cô giáo</option>
            </select>
          </div>

          <div class="customer-field customer-field--with">
            <label class="customer-label" for="customer-with">Đi cùng</label>
            <select id="customer-with" class="customer-select" name="with">
              <option value="" selected>Không</option>
              <option value="nguoi-thuong">Người thương</option>
              <option value="vo-chong">Vợ chồng</option>
              <option value="gia-dinh">Gia đình</option>
            </select>
          </div>

          <div class="customer-field customer-field--mode">
            <label class="customer-label" for="customer-mode">Buổi tiệc</label>
            <select id="customer-mode" class="customer-select" name="mode" required>
              <option value="0">Nhà trai · 15/11</option>
              <option value="1">Nhà gái · 15/11</option>
              <option value="9">Miền Nam · 21/11</option>
            </select>
          </div>

          <button type="submit" id="customer-submit" class="customer-submit">Tạo link &amp; QR</button>
          <button type="button" id="customer-edit-cancel" class="customer-edit-cancel" hidden>Hủy sửa</button>
        </div>

        <div class="customer-form-below">
          <p id="customer-edit-banner" class="customer-edit-banner" hidden></p>
          <p id="customer-greeting-preview" class="customer-greeting-preview" hidden></p>
        </div>

        <div id="customer-lists" class="customer-lists">
          <div class="customer-list-toolbar">
            <div class="customer-mode-filters" role="group" aria-label="Lọc buổi tiệc">
              <button type="button" class="customer-filter-btn is-active" data-mode-filter="all">Tất cả</button>
              <button type="button" class="customer-filter-btn" data-mode-filter="0">Nhà trai</button>
              <button type="button" class="customer-filter-btn" data-mode-filter="1">Nhà gái</button>
              <button type="button" class="customer-filter-btn" data-mode-filter="9">Miền Nam</button>
            </div>
            <div class="customer-list-actions">
              <span id="customer-list-sync-status" class="customer-list-sync"></span>
              <span id="customer-list-count" class="customer-list-count"></span>
              <a class="customer-tool-btn customer-tool-btn--ghost" href="wedding_template.xlsx" download>Tải mẫu Excel</a>
              <button type="button" id="customer-excel-upload" class="customer-tool-btn">Upload Excel</button>
              <input type="file" id="customer-excel-input" accept=".xlsx,.xls" hidden />
            </div>
          </div>
          <p id="customer-upload-status" class="customer-upload-status" hidden></p>
          <div class="customer-table-wrap">
            <table class="customer-table">
              <thead>
                <tr>
                  <th>Họ và tên</th>
                  <th>Biệt danh</th>
                  <th>Mode</th>
                  <th>Xưng hô</th>
                  <th>Đi cùng</th>
                  <th>Link</th>
                  <th>QR</th>
                  <th>Lượt mở link</th>
                  <th>Confirm name</th>
                  <th>Confirm</th>
                  <th>Số người</th>
                  <th>Sửa</th>
                  <th>Xóa</th>
                </tr>
              </thead>
              <tbody id="customer-guest-tbody"></tbody>
            </table>
            <p id="customer-list-empty" class="customer-list-empty">Chưa có khách. Thêm bằng form hoặc upload Excel.</p>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script type="module" src="../assets/js/firebase-config.js"></script>
  <script type="module" src="../assets/js/customer.js"></script>
</body>
</html>
