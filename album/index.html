<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Album ảnh cưới — Văn Hùng &amp; Thu Trang</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/album-pages.css?v=album-full-6">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20y=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
</head>
<body class="intro-complete album-view-page">
  <div id="audio-toggle-btn" class="audio-floating-btn is-paused" title="Phát / Dừng nhạc nền">
    <div id="audio-disk" class="audio-disk-rotate">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
  </div>

  <div class="album-page-wrap">
    <nav class="album-page-nav" aria-label="Điều hướng album">
      <a href="../index.html">← Về thiệp cưới</a>
    </nav>
    <section class="gallery-canvas-section">
      <header class="album-section-head">
        <h1 class="album-section-title">Album ảnh cưới</h1>
        <hr class="album-section-rule" aria-hidden="true" />
      </header>
      <div class="album-mosaic" id="album-mosaic"></div>
    </section>

    <footer class="canvas-footer-section blossom-zone-section">
      <div class="blossom-pulse-layer blossom-pulse-layer--section" data-blossom-zone="footer" aria-hidden="true"></div>
      <div class="footer-couple-title">VĂN HÙNG &amp; THU TRANG</div>
    </footer>
  </div>

  <div id="lightbox-modal" class="lightbox-backdrop" role="dialog" aria-modal="true" aria-hidden="true"
    aria-label="Xem ảnh phóng to">
    <button id="lightbox-close" class="lightbox-close-btn" type="button" title="Đóng">&times;</button>
    <div class="lightbox-stage">
      <button id="lightbox-prev" class="lightbox-nav-btn lightbox-nav-btn--prev" type="button"
        title="Ảnh trước" aria-label="Ảnh trước">&#8249;</button>
      <img id="lightbox-img" src="" alt="Ảnh phóng to" />
      <button id="lightbox-next" class="lightbox-nav-btn lightbox-nav-btn--next" type="button"
        title="Ảnh sau" aria-label="Ảnh sau">&#8250;</button>
    </div>
    <p id="lightbox-counter" class="lightbox-counter" hidden></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script type="module" src="../assets/js/firebase-config.js"></script>
  <script type="module">
    import { initWeddingAudio } from '../assets/js/wedding-audio.js';
    initWeddingAudio({ enableIntroAutoplay: false });
  </script>
  <script src="../assets/js/scroll-reveal.js" defer></script>
  <script type="module" src="../assets/js/album-view.js?v=concept-album-10"></script>
  <script src="../assets/js/cherry-blossom-bg.js" defer></script>
</body>
</html>
