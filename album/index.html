<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Album ảnh cưới — Văn Hùng &amp; Thu Trang</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/album-pages.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20y=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
</head>
<body class="intro-complete album-view-page">
  <div class="album-page-wrap">
    <nav class="album-page-nav" aria-label="Điều hướng album">
      <a href="../index.html">← Về thiệp cưới</a>
    </nav>
    <section class="gallery-canvas-section">
      <header class="album-section-head">
        <h1 class="album-section-title">Album ảnh cưới</h1>
        <hr class="album-section-rule" aria-hidden="true" />
      </header>
      <div class="album-mosaic" id="album-mosaic"></div>
    </section>

    <footer class="canvas-footer-section blossom-zone-section">
      <div class="blossom-pulse-layer blossom-pulse-layer--section" data-blossom-zone="footer" aria-hidden="true"></div>
      <div class="footer-couple-title">VĂN HÙNG &amp; THU TRANG</div>
      <div class="footer-script-thankyou">Thank You!</div>
      <p class="footer-closing-text">
        Chân thành cảm ơn sự hiện diện và những lời chúc phúc tốt đẹp nhất của quý khách và người thân!
      </p>
    </footer>
  </div>

  <div id="lightbox-modal" class="lightbox-backdrop">
    <button id="lightbox-close" class="lightbox-close-btn" title="Đóng" type="button">&times;</button>
    <img id="lightbox-img" src="" alt="Ảnh phóng to" />
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script type="module" src="../assets/js/firebase-config.js"></script>
  <script type="module" src="../assets/js/album-view.js"></script>
  <script src="../assets/js/cherry-blossom-bg.js" defer></script>
</body>
</html>
